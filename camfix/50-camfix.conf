# Hide the raw ASUS webcam (and its IR sensor) so apps only see the
# camfix-enhanced virtual camera, and make that the preferred camera.
monitor.v4l2.rules = [
  {
    matches = [ { device.vendor.id = "0x3277", device.product.id = "0x0018" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    matches = [ { api.v4l2.cap.card = "ASUS Webcam (Enhanced)" } ]
    actions = { update-props = { priority.session = 2000, node.description = "ASUS Webcam (Enhanced)" } }
  }
]
